[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.0.0"
description = "Turn a short phone video into a volume where time is the third dimension"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["av>=14", "numpy>=2", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
kaggle = ["kaggle>=1.8", "six"]

[tool.setuptools]
packages = ["continuum"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
